<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>riStore | Sign up</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous" />
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"></script>
		<script
			src="https://kit.fontawesome.com/8d7e09f720.js"
			crossorigin="anonymous"></script>
	</head>
	<body class="bg-black vstack gap-5" data-bs-theme="dark">
		<nav
			class="navbar d-block d-md-none navbar-expand-md navbar-dark bg-opacity-75 p-3 px-md-0">
			<div class="container-fluid">
				<a href="./../index.html" class="navbar-brand fw-bold">
					<i class="fa-solid fa-bag-shopping"></i>riStore
				</a>
			</div>
		</nav>

		<main class="container-fluid vh-100 mb-5 mb-md-0">
			<div class="row row-cols-1 row-cols-md-2 h-100">
				<div
					class="col d-none d-md-flex flex-column h-100 justify-content-center align-items-center">
					<div class="card rounded-0 border-0 h-100 w-100">
						<img
							class="card-img h-100 object-fit-cover opacity-50"
							src="./../img/loginSignup.jpg"
							alt="" />

						<div
							class="card-img-overlay d-flex flex-column justify-content-center align-items-center h-100">
							<a href="./../index.html" class="btn fw-bold">
								<h1 class="display-6 fw-bold">
									<i class="fa-solid fa-bag-shopping"></i>riStore
								</h1>
							</a>
							<div class="d-flex flex-column text-center">
								<h2 class="display-4 fw-bold text-white">Welcome to Fun</h2>
								<p class="text-white fs-5 fw-bold">
									The #1 place to download and play games.
								</p>
							</div>
						</div>
					</div>
				</div>

				<div
					class="col d-flex flex-column justify-content-center align-items-center">
					<!-- Photo by <a href="https://unsplash.com/@nickhamze?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Nick Hamze</a> on <a href="https://unsplash.com/photos/nintendo-game-card-collection-V6wm5Z18obw?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a> -->

					<div class="card p-4 text-bg-dark bg-opacity-50">
						<form action="./../index.html" class="text-white" method="get">
							<label class="form-label" for="uname">Username</label>
							<input
								class="form-control mb-3 bg-opacity-75"
								id="uname"
								name="uname"
								type="uname"
								placeholder="Enter your username" />
							<label class="form-label" for="email">E-mail</label>
							<input
								class="form-control mb-3 bg-opacity-75"
								id="email"
								name="email"
								type="email"
								placeholder="Enter your email" />
							<label class="form-label" for="pass">Password</label>
							<input
								class="form-control mb-3 bg-opacity-75"
								id="pass"
								name="pass"
								type="password"
								placeholder="Enter your password" />
							<label class="form-label" for="repass">Confirm Password</label>
							<input
								class="form-control mb-3 bg-opacity-75"
								id="repass"
								name="repass"
								type="password"
								placeholder="Retype your password" />
							<div class="form-check">
								<input
									class="form-check-input"
									type="checkbox"
									name="TandC"
									id="TandC" />
								<label class="form-check-label form-label fs-6" for="TandC">
									You agree to our <a href="#">Terms of Service.</a>
								</label>
							</div>
							<div class="form-check">
								<input
									class="form-check-input"
									type="checkbox"
									name="remember"
									id="remember" />
								<label class="form-check-label form-label fs-6" for="remember">
									Remember me on this device.
								</label>
							</div>
							<button class="btn btn-light w-100" type="submit">Sign Up</button>
							<p class="fs-6 text-secondary opacity-75 mt-1">
								Have an account already?
								<a href="./login.html">Login</a>
							</p>
						</form>
						<div class="text-center">
							<hr />
							<p>Or Sign up using:</p>
							<div class="btn-group w-100">
								<button
									class="btn btn-outline-light w-100 mb-3 fw-bold"
									type="button"
									data-bs-toggle=""
									aria-expanded="false">
									<i class="fa-brands fa-google"></i>
								</button>
								<button
									class="btn btn-outline-light w-100 mb-3 fw-bold"
									type="button"
									data-bs-toggle=""
									aria-expanded="false">
									<i class="fa-brands fa-facebook"></i>
								</button>
								<button
									class="btn btn-outline-light w-100 mb-3 fw-bold"
									type="button"
									data-bs-toggle=""
									aria-expanded="false">
									<i class="fa-brands fa-apple"></i>
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
