<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous" />
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"></script>
		<script
			src="https://kit.fontawesome.com/8d7e09f720.js"
			crossorigin="anonymous"></script>
	</head>
	<body class="bg-black vstack gap-5" data-bs-theme="dark">
		<nav
			class="navbar fixed-top navbar-expand-md navbar-dark bg-opacity-75 p-3 px-md-0">
			<div class="container-fluid">
				<a href="./../index.html" class="navbar-brand fw-bold">
					<i class="fa-solid fa-bag-shopping"></i>riStore
				</a>
			</div>
		</nav>

		<main class="container-fluid vh-100">
			<div class="row row-cols-1 row-cols-md-2 h-100">
				<div
					class="col d-flex flex-column h-100 justify-content-center align-items-center">
					<div class="card rounded-0 border-0 h-100 w-100">
						<img
							class="card-img h-100 object-fit-cover opacity-50"
							src="./../img/loginSignup.jpg"
							alt="" />

						<div
							class="card-img-overlay d-flex justify-content-center align-items-center h-100">
							<h2 class="display-4 fw-bold text-white">Welcome to Fun</h2>
						</div>
					</div>
				</div>

				<div
					class="col d-flex flex-column justify-content-center align-items-center">
					<!-- Photo by <a href="https://unsplash.com/@nickhamze?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Nick Hamze</a> on <a href="https://unsplash.com/photos/nintendo-game-card-collection-V6wm5Z18obw?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a> -->

					<div class="card p-5 text-bg-dark bg-opacity-50">
						<form action="/" class="text-white" method="get">
							<h3 class="display-6 fw-bold mb-4 text-center">riStore</h3>
							<p class="text-center text-secondary">
								Login back to your favourite adventure.
							</p>
							<hr />
							<label class="form-label" for="email">E-mail</label>
							<input
								class="form-control mb-3 bg-opacity-75"
								id="email"
								name="email"
								type="email"
								placeholder="your email" />
							<label class="form-label" for="pass">Password</label>
							<input
								class="form-control mb-3 bg-opacity-75"
								id="pass"
								name="pass"
								type="password"
								placeholder="**********" />
							<div class="form-check">
								<input
									class="form-check-input"
									type="checkbox"
									name="remember"
									id="remember" />
								<label class="form-check-label form-label fs-6" for="remember">
									Remember me on this device.
								</label>
							</div>
							<button class="btn btn-light w-100" type="submit">Login</button>
							<p class="fs-6 text-secondary opacity-75 mt-1">
								Don't have an account yet?
								<a href="">Sign up</a>
							</p>
						</form>
						<div class="text-center">
							<hr />
							<p>Or login using:</p>
							<div class="btn-group w-100">
								<button
									class="btn btn-outline-light w-100 mb-3 fw-bold"
									type="button"
									data-bs-toggle=""
									aria-expanded="false">
									<i class="fa-brands fa-google"></i>
								</button>
								<button
									class="btn btn-outline-light w-100 mb-3 fw-bold"
									type="button"
									data-bs-toggle=""
									aria-expanded="false">
									<i class="fa-brands fa-facebook"></i>
								</button>
								<button
									class="btn btn-outline-light w-100 mb-3 fw-bold"
									type="button"
									data-bs-toggle=""
									aria-expanded="false">
									<i class="fa-brands fa-apple"></i>
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
